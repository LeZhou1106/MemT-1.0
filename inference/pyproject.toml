[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memt-sglang"
version = "0.1.0"
description = "MemT session memory extensions for SGLang 0.5.16"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0 AND MIT"
license-files = ["LICENSE", "memt_sglang/_vendor/fla/FLA_LICENSE"]
dependencies = []

[project.optional-dependencies]
client = ["transformers==5.12.1"]
server = ["torch==2.11.0", "safetensors>=0.6,<1", "sglang==0.5.16", "transformers==5.12.1", "flashinfer-python[cu13]==0.6.14", "sglang-kernel==0.4.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memt_sglang*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"memt_sglang._vendor.fla" = ["FLA_LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["memt_sglang/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Registry entries install runtime hooks before importing native model classes.
[tool.ruff.lint.per-file-ignores]
"memt_sglang/models/qwen3_5_moe.py" = ["E402"]
"memt_sglang/models/deepseek_v4.py" = ["E402"]
